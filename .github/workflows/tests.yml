name: Tests

on:
  push:
    branches: [ "main" ]
  # Every pull request, including ones stacked on another PR's branch
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Swift tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run tests
        run: swift test --parallel

  ios-build:
    name: Build (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build for iOS
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Astroject-Package \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  strict:
    name: Build with warnings as errors
    runs-on: macos-15
    # Non-blocking until the deprecated Assembler/Assembly APIs are removed (2.0).
    # Calls into those APIs emit deprecation warnings today. Remove this line once they are gone.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build library and tests with -warnings-as-errors
        run: swift build --build-tests -Xswiftc -warnings-as-errors
